<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128">
  <!-- Lantern Deep icon: a lantern glowing in the dark. Palette colors only. -->
  <rect width="128" height="128" rx="24" fill="#1a1410"/>
  <circle cx="64" cy="72" r="46" fill="#3b2f2a"/>
  <!-- Handle -->
  <path d="M48 34 Q64 12 80 34" fill="none" stroke="#6b5a4e" stroke-width="6" stroke-linecap="round"/>
  <!-- Top and bottom caps -->
  <rect x="42" y="32" width="44" height="10" rx="3" fill="#6b5a4e"/>
  <rect x="40" y="100" width="48" height="10" rx="3" fill="#6b5a4e"/>
  <!-- Glass with the glow -->
  <rect x="46" y="42" width="36" height="58" rx="6" fill="#f2a33a"/>
  <!-- Flame -->
  <path d="M64 52 C74 66 74 80 64 90 C54 80 54 66 64 52 Z" fill="#ffd966"/>
  <!-- Bars -->
  <rect x="46" y="42" width="4" height="58" fill="#6b5a4e"/>
  <rect x="78" y="42" width="4" height="58" fill="#6b5a4e"/>
</svg>
